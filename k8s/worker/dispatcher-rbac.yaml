# RBAC cho dispatcher (CronJob task-worker): chi du quyen tao Job xu ly
# task va kiem tra Secret dockerhub-pull trong namespace production.
# Nguyen tac least privilege: khong cap quyen gi khac.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-dispatcher
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-dispatcher
  namespace: production
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dockerhub-pull"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: task-dispatcher
  namespace: production
subjects:
  - kind: ServiceAccount
    name: task-dispatcher
    namespace: production
roleRef:
  kind: Role
  name: task-dispatcher
  apiGroup: rbac.authorization.k8s.io
