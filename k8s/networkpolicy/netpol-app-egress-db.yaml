# Egress cua Web/Job toi HAProxy:3306 — guide muc 10.5.
# Them label db-init/db-migrate de 2 Job khoi tao DB van chay duoc khi
# NetworkPolicy da bat (chay lai Job sau khi bat netpol).
# Them label task-processor: Job xu ly task cung can noi MySQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-db
  namespace: production
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["nodejs-web", "task-worker", "task-processor", "db-init", "db-migrate"]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: haproxy
      ports:
        - protocol: TCP
          port: 3306
