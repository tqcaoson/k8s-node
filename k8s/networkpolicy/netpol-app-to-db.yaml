# Web/Job -> HAProxy:3306 — guide muc 10.5.
# Bo sung so voi guide goc: HAProxy can egress toi PXC Pod (3306) vi
# default-deny da chan moi egress; neu thieu rule nay HAProxy khong noi
# duoc toi MySQL du ingress da mo.
# Them task-processor: Job xu ly task (do dispatcher tao) cung can noi MySQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-pxc
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: haproxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["nodejs-web", "task-worker", "task-processor", "db-init", "db-migrate"]
      ports:
        - protocol: TCP
          port: 3306
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pxc
      ports:
        - protocol: TCP
          port: 3306
