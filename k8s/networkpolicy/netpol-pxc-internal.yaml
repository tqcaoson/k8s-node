# Giao tiep noi bo Galera giua cac MySQL Pod — guide muc 10.6.
# SUA SO VOI GUIDE GOC: Operator nam o namespace pxc-operator (khac namespace),
# nen rule toi Operator phai co namespaceSelector; podSelector don thuan chi
# khop Pod trong cung namespace production va se chan nham Operator.
# Label cua Pod Operator la app.kubernetes.io/name=pxc-operator (ten chart/
# release), KHONG phai percona-xtradb-cluster-operator (do la ten image).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pxc-internal
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pxc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pxc
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: proxysql
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pxc-operator
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pxc-operator
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 4444
        - protocol: TCP
          port: 4567
        - protocol: UDP
          port: 4567
        - protocol: TCP
          port: 4568
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pxc
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 4444
        - protocol: TCP
          port: 4567
        - protocol: UDP
          port: 4567
        - protocol: TCP
          port: 4568
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pxc-operator
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pxc-operator
